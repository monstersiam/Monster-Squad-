<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0f">
<link rel="manifest" href="manifest.json">
<title>Monster Squad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand" onclick="showPage('home')">
    <img src="logo.png" alt="Monster Squad">
    <span>MONSTER SQUAD</span>
  </div>
  <nav>
    <button data-page="home">Home</button>
    <button data-page="notice">Notice</button>
    <button data-page="member">Member</button>
    <button data-page="profile">Profile</button>
  </nav>
  <button id="langBtn" class="lang">বাংলা</button>
</header>

<main>
<section id="home" class="page active">
  <div class="hero">
    <img class="hero-logo" src="logo.png" alt="Monster Squad logo">
    <h1 data-en="Monster Squad" data-bn="মনস্টার স্কোয়াড">Monster Squad</h1>
    <p class="tagline" data-en="Stay trustworthy, and you’ll find something good." data-bn="বিশ্বস্ত হয়ে থাকো, ভালো কিছু পাবে।">Stay trustworthy, and you’ll find something good.</p>
    <p class="admin" data-en="Admin ID: " data-bn="এডমিন আইডি: ">Admin ID: <strong id="adminIdText">MS-ADMIN</strong></p>
    <div class="shortcuts">
      <button onclick="showPage('notice')">Notice</button>
      <button onclick="showPage('member')">Member</button>
      <button onclick="showPage('profile')">Profile</button>
    </div>
  </div>
</section>

<section id="notice" class="page notice-page">
  <div class="watermark"></div>
  <div class="content">
    <div class="section-head">
      <h2 data-en="Notice Board" data-bn="নোটিশ বোর্ড">Notice Board</h2>
      <button class="admin-btn" onclick="openAdmin()">Admin</button>
    </div>
    <div id="noticeList" class="notice-list"></div>
    <p id="noNotice" class="empty">No notices yet.</p>
  </div>
</section>

<section id="member" class="page">
  <div class="content">
    <h2><span data-en="Total Team Members:" data-bn="মোট টিম মেম্বার:">Total Team Members:</span> <span id="totalMembers">0</span></h2>
    <div id="memberList" class="member-list"></div>
    <button class="admin-btn add" onclick="openAdmin()">Add / Manage Members</button>
  </div>
</section>

<section id="profile" class="page">
  <div class="content">
    <h2 data-en="Profile" data-bn="প্রোফাইল">Profile</h2>
    <div id="profileCard" class="profile-card">
      <div class="profile-photo-wrap"><img id="profilePhoto" src="logo.png" alt="Profile"></div>
      <div class="profile-info">
        <p><b data-en="Serial:" data-bn="সিরিয়াল:">Serial:</b> <span id="profileSerial">—</span></p>
        <p><b data-en="Name:" data-bn="নাম:">Name:</b> <span id="profileName">—</span></p>
        <p><b data-en="Join Date:" data-bn="জয়েন ডেট:">Join Date:</b> <span id="profileJoin">—</span></p>
        <button class="admin-btn" onclick="editOwnProfile()" data-en="Edit Name & Photo" data-bn="নাম ও ছবি পরিবর্তন">Edit Name & Photo</button>
      </div>
    </div>
    <p class="hint" data-en="Users can change only their name and photo. Serial and Join Date cannot be changed." data-bn="ইউজার শুধু নিজের নাম ও ছবি পরিবর্তন করতে পারবে। সিরিয়াল ও জয়েন ডেট পরিবর্তন করা যাবে না.">Users can change only their name and photo. Serial and Join Date cannot be changed.</p>
  </div>
</section>
</main>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button class="close" onclick="closeModal()">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
